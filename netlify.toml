[build]
  # Removed npx prisma generate from here because Next.js 
  # usually triggers it, but we will keep it simple.
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SHARP_IGNORE_GLOBAL_LIBVIPS = "1"
  # Use only the standard target for Netlify's Ubuntu/Noble environment
  PRISMA_CLI_BINARY_TARGETS = "debian-openssl-3.0.x"
  NPM_FLAGS = "--include=optional"

[functions]
  included_files = [
    "public/uploads/**/*",
    "node_modules/.prisma/client/**/*",
    "node_modules/@prisma/client/**/*"
  ]

# Keep your headers and plugins as they were

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"