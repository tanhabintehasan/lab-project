[build]
  # IMPORTANT: We add prisma generate BEFORE the build to ensure the client exists
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  SHARP_IGNORE_GLOBAL_LIBVIPS = "1"
  # Support multiple targets for compatibility
  PRISMA_CLI_BINARY_TARGETS = "debian-openssl-3.0.x, rhel-openssl-3.0.x"
  NPM_FLAGS = "--include=optional"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  # Keep your inclusions, but let's make sure the engines are bundled
  included_files = [
    "public/uploads/**/*",
    "node_modules/.prisma/client/**/*",
    "node_modules/@prisma/client/**/*",
    "node_modules/prisma/build/*"
  ]

# Your headers are already perfect for security; keep them as they are.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"